name: trackfit
description: "Local-first health data app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  crypto: ^3.0.8
  desktop_drop: ^0.8.0
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: any
  mime: ^2.1.0
  path_provider: ^2.1.6
  trackfit_core:
    path: ../../packages/trackfit_core
  trackfit_db:
    path: ../../packages/trackfit_db

dev_dependencies:
  drift: ^2.34.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
