name: trackfit
description: "Local-first health data app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  crypto: ^3.0.8
  desktop_drop: ^0.8.0
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: any
  mime: ^2.1.0
  path_provider: ^2.1.6
  pdfrx: ^2.4.8
  shared_preferences: ^2.5.6
  sqlite3: ^3.0.0
  standardize:
    path: ../../packages/standardize
  trackfit_core:
    path: ../../packages/trackfit_core
  trackfit_db:
    path: ../../packages/trackfit_db
  ucum:
    path: ../../packages/ucum

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Built by tools/build_terminology, do not edit by hand.
    - assets/terminology.sqlite
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
